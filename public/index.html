<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>BreathCare Health System - Autenticação</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Gradiente de fundo inspirado nas cores do logotipo */
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 30%, #0d9488 75%, #10b981 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.96);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      text-align: center;
    }

    .logo-img {
      max-width: 240px;
      height: auto;
      margin-bottom: 20px;
    }

    h2 {
      color: #1f2937;
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
    }

    input {
      padding: 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    button.btn-entrar {
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #1e40af 0%, #0d9488 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    button.btn-entrar:hover {
      opacity: 0.95;
    }

    .erro {
      color: #dc2626;
      font-size: 13px;
      font-weight: bold;
      margin-top: 12px;
    }

    .footer-text {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="logo.png" alt="BreathCare Logo" class="logo-img" />
    <h2>Acesso ao Sistema</h2>
    
    <form id="formLogin">
      <div class="input-group">
        <label for="loginUsername">Nome de Utilizador</label>
        <input id="loginUsername" type="text" placeholder="Introduza o seu username" required />
      </div>
      
      <div class="input-group">
        <label for="loginPassword">Palavra-passe</label>
        <input id="loginPassword" type="password" placeholder="Introduza a sua password" required />
      </div>
      
      <button class="btn-entrar" type="submit">Entrar na Plataforma</button>
      <p id="erroLogin" class="erro"></p>
    </form>

    <p class="footer-text">BreathCare Health System &copy; 2026</p>
  </div>

  <script>
    // Limpar sessões antigas ao entrar na página inicial de login
    localStorage.removeItem('breathcare_token');
    localStorage.removeItem('breathcare_user');

    async function fazerLogin(event) {
      event.preventDefault();
      const erroElement = document.getElementById('erroLogin');
      erroElement.textContent = '';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const resposta = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || 'Falha na autenticação.');

        // Armazenamento seguro dos dados da sessão e token JWT
        localStorage.setItem('breathcare_token', dados.token);
        localStorage.setItem('breathcare_user', JSON.stringify(dados.user));

        // Redirecionamento baseado nas permissões (ROLE) do utilizador
        const perfil = dados.user.role.toUpperCase();
        if (perfil === 'ADMIN') {
          window.location.href = 'admin.html';
        } else if (perfil === 'MEDICO') {
          window.location.href = 'medico.html';
        } else if (perfil === 'UTENTE') {
          window.location.href = 'utente.html';
        } else {
          throw new Error('Perfil de utilizador não reconhecido pelo sistema.');
        }

      } catch (e) {
        erroElement.textContent = e.message;
      }
    }

    document.getElementById('formLogin').addEventListener('submit', fazerLogin);
  </script>
</body>
</html>
