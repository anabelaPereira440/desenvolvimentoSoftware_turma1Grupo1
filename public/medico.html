<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>BreathCare - Painel do Médico</title>
  <style>
    /* Reaproveitamento da Estética Administrativa */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 30%, #0d9488 75%, #10b981 100%);
      display: flex;
      min-height: 100vh;
      color: #1f2937;
    }

    nav {
      width: 260px;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      padding: 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 15px rgba(0,0,0,0.2);
    }

    nav h2 { margin-top: 0; font-size: 20px; border-bottom: 2px solid #1e293b; padding-bottom: 15px; color: #10b981; }

    nav button {
      display: block; width: 100%; margin-bottom: 12px; padding: 12px 16px;
      background: #1e293b; color: #e2e8f0; border: none; border-radius: 8px;
      text-align: left; cursor: pointer; font-size: 14px; transition: all 0.2s;
    }

    nav button.ativo { background: linear-gradient(135deg, #1e40af 0%, #0d9488 100%); color: white; }

    main { flex: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; }

    .pagina {
      display: none; background: rgba(255, 255, 255, 0.96);
      padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .pagina.ativa { display: block; }

    h1 { color: #1e3a8a; font-size: 24px; }
    h3.seccao-titulo { color: #0d9488; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; margin-top: 30px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    input, select { padding: 12px; border-radius: 8px; border: 1px solid #d1d5db; }

    .admin-btn {
      padding: 12px 24px; font-weight: bold; color: white; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #1e40af 0%, #0d9488 100%); cursor: pointer; margin-top: 20px;
    }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    .admin-table th, .admin-table td { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    .admin-table th { background-color: #f8fafc; }
  </style>
</head>
<body>

<nav>
  <h2>BreathCare Médico</h2>
  <button id="btn-prescricoes" class="ativo" onclick="mudarAba('prescricoes')">Prescrições</button>
  <button id="btn-exames" onclick="mudarAba('exames')">Exames</button>
  <button onclick="window.location.href='index.html'" style="margin-top: auto; border: 1px solid #dc2626; background: transparent;">Sair</button>
</nav>

<main>
  <section id="prescricoes" class="pagina ativa">
    <h1>Gestão de Prescrições</h1>
    <div class="form-grid">
      <div class="input-group"><label>Medicamento:</label><input type="text" id="p-med"></div>
      <div class="input-group"><label>Dose:</label><input type="text" id="p-dose"></div>
      <div class="input-group"><label>ID Utente:</label><input type="number" id="p-utente"></div>
    </div>
    <button class="admin-btn" onclick="criarPrescricao()">Registar Prescrição</button>
    
    <h3 class="seccao-titulo">Histórico</h3>
    <table class="admin-table">
      <thead><tr><th>ID</th><th>Medicamento</th><th>Dose</th><th>Validade</th></tr></thead>
      <tbody id="lista-prescricoes"></tbody>
    </table>
  </section>

  <section id="exames" class="pagina">
    <h1>Gestão de Exames</h1>
    <div class="form-grid">
      <div class="input-group"><label>Nome do Exame:</label><input type="text" id="e-nome"></div>
      <div class="input-group"><label>Código:</label><input type="text" id="e-cod"></div>
      <div class="input-group"><label>ID Utente:</label><input type="number" id="e-utente"></div>
    </div>
    <button class="admin-btn" onclick="criarExame()">Registar Exame</button>

    <h3 class="seccao-titulo">Histórico</h3>
    <table class="admin-table">
      <thead><tr><th>ID</th><th>Exame</th><th>Código</th></tr></thead>
      <tbody id="lista-exames"></tbody>
    </table>
  </section>
</main>

<script>
  function mudarAba(id) {
    document.querySelectorAll('.pagina').forEach(p => p.classList.remove('ativa'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('ativo'));
    document.getElementById(id).classList.add('ativa');
    document.getElementById('btn-' + id).classList.add('ativo');
    if(id === 'prescricoes') listarPrescricoes(); else listarExames();
  }

  async function listarPrescricoes() {
    const res = await fetch('/prescricoes');
    const data = await res.json();
    document.getElementById('lista-prescricoes').innerHTML = data.map(p => `
      <tr><td>${p.id}</td><td>${p.medicamento}</td><td>${p.dose}</td><td>${new Date(p.dataValidade).toLocaleDateString()}</td></tr>
    `).join('');
  }

  async function criarPrescricao() {
    const payload = {
      medicamento: document.getElementById('p-med').value,
      dose: document.getElementById('p-dose').value,
      utenteId: parseInt(document.getElementById('p-utente').value),
      medico_nome: "Dr. Exemplo" 
    };
    await fetch('/prescricoes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    alert("Criado!"); listarPrescricoes();
  }

  // Repetir lógica similar para Exames...
  async function listarExames() { /* ... */ }
  async function criarExame() { /* ... */ }

  listarPrescricoes();
</script>
</body>
</html>
